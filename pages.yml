# Publishes public/ as a static site to GitHub Pages.
# Enable in: Settings -> Pages -> Source: GitHub Actions.
# Note: Pages hosts the UI only. Set window.API_BASE in index.html (or before it)
# to point at your deployed backend (e.g. Render), per README "Hosting options".
name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
